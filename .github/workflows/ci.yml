name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WingetUpdater.csproj

      - name: Build
        run: dotnet build WingetUpdater.csproj -c Release --no-restore

      - name: Run parser self-tests
        run: dotnet run --project WingetUpdater.csproj -c Release --no-build -- --selftest
